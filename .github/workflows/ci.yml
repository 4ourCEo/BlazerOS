name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-and-tests:
    name: Engine pin, tests, parity
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Engine pin drift
        run: ./scripts/check-engine-pin.sh

      - name: Build
        run: swift build

      - name: Test (includes engine seal and contract tests)
        run: swift test

      - name: Parity tool
        run: swift run -c release Parity
