name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-and-tests:
    name: Engine pin, tests, parity
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # The image's default Xcode trails the SDK this app targets, so select the
      # newest installed one before building.
      - uses: ./.github/actions/select-xcode

      - name: Engine pin drift
        run: ./scripts/check-engine-pin.sh

      - name: Intents constants drift
        run: ./scripts/check-intents-constants.sh

      - name: Build
        run: swift build

      - name: Test (includes engine seal and contract tests)
        run: swift test

      - name: Parity tool
        run: swift run -c release Parity

  ios-app:
    name: iPhone app build
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/select-xcode

      # The app, widgets, Live Activity and intents are only compiled by the Xcode
      # project; `swift build` never sees them. Signing is not needed to compile.
      - name: Build for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project iPhone/BlazerOS.xcodeproj \
            -scheme BlazerOS \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      # BlazerTests covers the desk layout and the iPhone execution flow. It only
      # runs from the Xcode project, so it needs a concrete simulator. Ask
      # xcodebuild which destinations it accepts instead of guessing from simctl.
      # The step is bounded: a stuck simulator fails in minutes instead of
      # holding the required check open for the whole job timeout.
      - name: Run the iPhone tests
        timeout-minutes: 15
        run: |
          set -o pipefail
          destinations=$(xcodebuild \
            -project iPhone/BlazerOS.xcodeproj \
            -scheme BlazerOS \
            -showdestinations)
          echo "$destinations"
          udid=$(echo "$destinations" \
            | grep "name:iPhone" \
            | sed -nE 's/.*id:([0-9A-F-]{36}).*/\1/p' \
            | head -1)
          if [ -z "$udid" ]; then
            echo "No iPhone simulator available to xcodebuild" >&2
            exit 1
          fi
          echo "Testing on $udid"
          # Clear devices left behind by the image so xcodebuild boots a clean one.
          xcrun simctl shutdown all || true
          xcodebuild \
            -project iPhone/BlazerOS.xcodeproj \
            -scheme BlazerOS \
            -destination "platform=iOS Simulator,id=$udid" \
            -configuration Debug \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES \
            test
