name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-and-tests:
    name: Engine pin, tests, parity
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # The image's default Xcode trails the SDK this app targets, so select the
      # newest installed one before building.
      - uses: ./.github/actions/select-xcode

      - name: Engine pin drift
        run: ./scripts/check-engine-pin.sh

      - name: Build
        run: swift build

      - name: Test (includes engine seal and contract tests)
        run: swift test

      - name: Parity tool
        run: swift run -c release Parity

  ios-app:
    name: iPhone app build
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/select-xcode

      # The app, widgets, Live Activity and intents are only compiled by the Xcode
      # project; `swift build` never sees them. Signing is not needed to compile.
      - name: Build for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project iPhone/BlazerOS.xcodeproj \
            -scheme BlazerOS \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
