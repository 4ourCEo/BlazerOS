name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-and-tests:
    name: Engine pin, tests, parity
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The image's default Xcode trails the SDK this app targets (Foundation Models,
      # iOS 26). Select the newest installed Xcode so CI builds the configuration that
      # ships instead of silently compiling the fallback paths.
      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_[0-9]*.app | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"

      - name: Toolchain
        run: swift --version

      - name: Engine pin drift
        run: ./scripts/check-engine-pin.sh

      - name: Build
        run: swift build

      - name: Test (includes engine seal and contract tests)
        run: swift test

      - name: Parity tool
        run: swift run -c release Parity
